name: Deploy Pipeline

on:
  push:
    branches:
      - gitops
    paths:
      - 'src/**'

env:
  AWS_REGION: us-west-2
  ECR_REPO: retail-store/ui

jobs:
  deploy-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ui:${IMAGE_TAG} src/ui

      - name: Tag Docker image
        run: |
          docker tag ui:${IMAGE_TAG} \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}

      - name: Push Docker image to ECR
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}

      - name: Update Helm values
        run: |
          sed -i "s/tag:.*/tag: ${IMAGE_TAG}/" src/ui/chart/values.yaml

      - name: Commit Helm changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/ui/chart/values.yaml
          git commit -m "chore(ui): update image tag ${IMAGE_TAG}" || echo "No changes"
          git push origin gitops

      - name: Done
        run: |
          echo "UI deployed successfully with tag ${IMAGE_TAG}"
